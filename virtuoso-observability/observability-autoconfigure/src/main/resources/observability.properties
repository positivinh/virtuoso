# Virtuoso observability defaults. Lowest priority: any application, profile or environment setting overrides them.
# Nothing is exported until a deployment sets the OTLP endpoints.

# Trace one request in ten; deployments that want every request set 1.0.
management.tracing.sampling.probability=0.1

# The OTLP metrics registry would otherwise push to http://localhost:4318 every minute.
management.otlp.metrics.export.enabled=false
