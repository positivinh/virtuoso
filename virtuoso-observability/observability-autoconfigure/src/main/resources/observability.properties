# Virtuoso observability defaults. Lowest priority: any application, profile or environment setting overrides them.
# Nothing is exported until a deployment sets the OTLP endpoints.

# Trace one request in ten; deployments that want every request set 1.0.
management.tracing.sampling.probability=0.1

# The OTLP metrics registry would otherwise push to http://localhost:4318 every minute.
management.otlp.metrics.export.enabled=false

# Latency buckets, so dashboards can compute percentiles (histogram_quantile). A few fixed boundaries instead of
# Micrometer's full percentile histograms, which publish hundreds of buckets per timer.
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
management.metrics.distribution.slo.http.client.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
management.metrics.distribution.slo.mongodb.driver.commands=1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
management.metrics.distribution.slo.spring.cloud.gateway.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s
