# Actions used by the shared workflows, and the dependency versions managed in virtuoso-bom.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ '*' ]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # one PR bumps both the root pom's spring-boot-starter-parent and the BOM's spring-boot.version
      spring-boot:
        patterns: [ 'org.springframework.boot:*' ]
    ignore:
      # must stay on the release built on Spring Boot's OpenTelemetry version; bump it by hand with Boot
      - dependency-name: 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'
